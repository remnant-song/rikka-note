[package]
name = "rikka-note"
version = "1.0.4"
description = "A Tauri App"
authors = ["remnant_song"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "rikka_note_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png", "devtools"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "=1"
tauri-plugin-store = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-http = { version = "2", features = ["unsafe-headers"] }
tauri-plugin-os = "2"
tauri-plugin-single-instance = "2"
urlencoding = "2.1.3"
percent-encoding = "2.3.0"
fuzzy-matcher = "0.3.7"
rayon = "1.8.0"
tokio = { version = "1", features = ["full"] }
url = "2.5"

tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-clipboard-manager = "2"
reqwest = { version = "0.13.2", default-features = false, features = ["rustls", "stream", "json", "charset", "http2"] }
futures-util = "0.3.32"
image = "0.25"
chacha20poly1305 = "0.10"
argon2 = "0.5"
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }
base64 = "0.22"
windows = { version = "0.58.0", features = [
    "Media_Ocr",
    "Graphics_Imaging",
    "Storage_Streams",
    "Foundation",
    "Win32_System_WinRT",
    "Win32_Foundation",
    "Graphics_DirectX_Direct3D11",
] }
zip = "2.2.0"

[dependencies.tauri-plugin-sql]
features = ["sqlite"]
version = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"
    tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"
xcap = "=0.6.0"

jieba-rs = { version = "0.7", features = ["textrank"] }
git2 = { version = "0.19", features = ["https", "ssh", "vendored-libgit2"] }
sherpa-onnx = { version = "1.12", default-features = false, features = ["shared"] }
cpal = "0.15"

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
git2 = { version = "0.19", default-features = false, features = ["vendored-libgit2"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.23"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies.tauri]
version = "2"
features = ["tray-icon"]
